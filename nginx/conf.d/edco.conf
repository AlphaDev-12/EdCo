# WebSocket Upgrade Map
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# EdCo API - HTTP Redirect & HTTPS Reverse Proxy
server {
    listen 80;
    server_name api.edco.local api.edco-platform.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.edco.local api.edco-platform.com;

    # SSL Certificates (Let's Encrypt / Certbot paths)
    ssl_certificate /etc/letsencrypt/live/api.edco-platform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.edco-platform.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100M;

    location / {
        proxy_pass http://edco-api:8080;
        proxy_http_version 1.1;

        # Header Forwarding
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# EdCo Admin Portal - HTTP Redirect & HTTPS Reverse Proxy
