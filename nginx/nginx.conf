worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Rate Limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    # Upstream backend services
    upstream edco_api {
        server edco-api:8080;
    }

    upstream edco_admin {
        server edco-admin:8080;
    }

    # HTTP server (redirects to HTTPS in production, or handles HTTP locally)
    server {
        listen 80;
        server_name api.edco.com admin.edco.com localhost;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Route /api/ to API service
        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://edco_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection keep-alive;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Healthcheck endpoint for load balancers
        location /healthz {
            proxy_pass http://edco_api/healthz;
            proxy_set_header Host $host;
        }

        # All other web requests to Admin Portal
        location / {
            proxy_pass http://edco_admin;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection keep-alive;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
